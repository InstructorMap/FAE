<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visualizador de Estilos FAE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@600;700&family=Outfit:wght@300;600&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-200 p-10 flex flex-col items-center min-h-screen">

    <h1 class="text-2xl font-bold text-gray-700 mb-10 uppercase tracking-widest">Elige el estilo visual para la F.A.E.</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 w-full max-w-6xl">

        <div class="bg-white border border-gray-300 shadow-sm flex flex-col overflow-hidden" style="font-family: 'Inter', sans-serif;">
            <div class="bg-[#0f4a8a] text-white p-4 font-bold tracking-wide uppercase text-sm border-b-4 border-[#d97706]">
                Opción 1: Institucional
            </div>
            <div class="p-8 text-center flex-grow">
                <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4 border border-gray-300">
                    <span class="text-[#0f4a8a] font-bold text-xl">🛡️</span>
                </div>
                <h3 class="text-[#0f4a8a] font-bold text-lg mb-2">Registro REMAEP</h3>
                <p class="text-gray-600 text-sm mb-6">Padrón Nacional de Profesionales de la Salud.</p>
                <button class="bg-[#0f4a8a] text-white font-bold py-2 px-6 rounded hover:bg-blue-800 transition">INGRESAR</button>
            </div>
        </div>

        <div class="bg-[#fafafa] rounded-3xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.08)] flex flex-col overflow-hidden border border-gray-100" style="font-family: 'Outfit', sans-serif;">
            <div class="p-8 text-center flex-grow flex flex-col items-center justify-center">
                <div class="text-gray-400 text-xs tracking-[0.2em] uppercase font-bold mb-6">Opción 2: Premium</div>
                <div class="w-16 h-16 bg-white rounded-2xl shadow-sm flex items-center justify-center mx-auto mb-4">
                    <span class="text-gray-800 font-bold text-xl">✨</span>
                </div>
                <h3 class="text-gray-800 font-bold text-xl mb-2">Registro REMAEP</h3>
                <p class="text-gray-400 text-sm mb-8 font-light">Validación oficial de competencias.</p>
                <button class="bg-gray-900 text-white font-bold py-3 px-8 rounded-full hover:bg-gray-700 transition w-full shadow-lg">Consultar</button>
            </div>
        </div>

        <div class="bg-[#0a192f] text-white border-4 border-[#d4af37] p-2 flex flex-col relative" style="font-family: 'Playfair Display', serif;">
            <div class="border border-[#d4af37] p-8 text-center flex-grow flex flex-col items-center justify-center">
                <div class="text-[#d4af37] text-xs tracking-[0.2em] uppercase font-sans font-bold mb-4">Opción 3: Académico</div>
                <div class="w-16 h-16 border-2 border-[#d4af37] rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="text-[#d4af37] font-bold text-xl">🏛️</span>
                </div>
                <h3 class="text-white font-bold text-2xl mb-2 tracking-wide">Registro REMAEP</h3>
                <div class="w-12 h-px bg-[#d4af37] mx-auto my-3"></div>
                <p class="text-gray-300 text-sm mb-6 font-sans">Federación Argentina de Educación</p>
                <button class="bg-transparent border border-[#d4af37] text-[#d4af37] font-bold py-2 px-6 hover:bg-[#d4af37] hover:text-[#0a192f] transition font-sans text-xs tracking-widest uppercase">Validar Identidad</button>
            </div>
        </div>

    </div>
</body>
</html>
